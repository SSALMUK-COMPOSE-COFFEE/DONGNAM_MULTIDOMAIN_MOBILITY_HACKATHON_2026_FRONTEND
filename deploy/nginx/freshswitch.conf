server {
    server_name freshswitch.ssalhub.xyz;

    listen 443 ssl;
    listen [::]:443 ssl;
    include snippets/ssl-ssalhub.conf;

    client_max_body_size 60m;
    include snippets/proxy-common.conf;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 24h;
    proxy_send_timeout 24h;

    location = / {
        proxy_pass http://127.0.0.1:18105;
    }

    location ~ ^/(login|signup|app)(/|$) {
        proxy_pass http://127.0.0.1:18105;
    }

    location ^~ /saas-assets/_next/static/ {
        proxy_pass http://127.0.0.1:18105/_next/static/;
    }

    location ^~ /test/_next/static/ {
        alias /var/lib/freshswitch/saas-legacy-static/;
    }

    location = /test {
        return 308 /$is_args$args;
    }

    location = /test/ {
        return 308 /$is_args$args;
    }

    location ~ ^/test(/(?:login|signup|app)(?:/.*)?)$ {
        return 308 $1$is_args$args;
    }

    location / {
        proxy_pass http://127.0.0.1:$upstream_port_path;
    }
}
