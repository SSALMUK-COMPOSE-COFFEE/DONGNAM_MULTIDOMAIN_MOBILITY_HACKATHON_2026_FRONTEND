name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, freshswitch-frontend]
    timeout-minutes: 20
    defaults:
      run:
        working-directory: /srv/freshswitch/frontend
    steps:
      - name: checkout
        run: |
          git fetch --depth 1 origin "$GITHUB_SHA"
          git checkout --force --detach "$GITHUB_SHA"

      - name: build and up
        run: docker compose up -d --build --remove-orphans

      - name: health
        run: |
          port=$(sed -n 's/^HOST_PORT=//p' .env 2>/dev/null || true)
          for _ in $(seq 1 30); do
            if curl -fsS -o /dev/null "http://127.0.0.1:${port:-18104}/plan"; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs --tail 100 web
          exit 1

      - name: prune
        if: always()
        run: docker image prune -f
